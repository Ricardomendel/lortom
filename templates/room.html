{% extends 'base.html' %}
{% block content %}
<div class="message-box">
    <h3>Chat Room <span class="room-code" id="room-code" onclick="copyRoomCode()" title="Click to copy the room code">{{ code }}</span></h3>
    <button type="button" id="leave-btn" onclick="leaveRoom()">Leave Room</button>
    <div id="user-count" onclick="toggleUserList()">Users: <span id="active-users">0</span></div>
    <div id="user-list" style="display: none;"></div>
    
    <div class="call-bar">
        <span id="call-status" class="call-status">📞 Not in a call</span>
        <span id="call-timer" class="call-timer" style="display: none;">00:00</span>
        <button type="button" id="call-btn" onclick="toggleCall()">📞 Start Call</button>
        <button type="button" id="mute-btn" onclick="toggleMute()" style="display: none;">Mute</button>
    </div>
    <div id="live-transcript" class="muted"></div>

    <div id="incoming-call-overlay" class="incoming-call-overlay" style="display: none;"></div>
    <div id="incoming-call-banner" class="incoming-call-banner" style="display: none;">
        <div class="incoming-call-text">📞 <span id="incoming-caller-name"></span> is calling…</div>
        <div class="incoming-call-actions">
            <button type="button" class="accept-btn" onclick="acceptCall()">Accept</button>
            <button type="button" class="decline-btn" onclick="declineCall()">Decline</button>
        </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="inputs">
        <div class="emoji-picker" id="emoji-picker" style="display: none;">
            <div class="emoji-grid" id="emoji-grid"></div>
        </div>
        <input type="file" id="file-input" accept=".pdf" style="display: none;">
        <button type="button" id="attach-btn" onclick="document.getElementById('file-input').click()" title="Attach a PDF">📎</button>
        <button type="button" id="emoji-btn" title="Insert an emoji">😊</button>
        <input type="text" placeholder="Message" name="message" id="message" required>
        <button type="button" name="send" id="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script type="text/javascript">
    var socketio = io();

    const messages = document.getElementById("messages");
    const username = "{{ session['name'] }}";

    // Derives a stable, pleasant color per name so avatars are consistent across the room.
    const nameToColor = (name) => {
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        const hue = Math.abs(hash) % 360;
        return `hsl(${hue}, 62%, 46%)`;
    };

    const initialOf = (name) => (name ? name.trim().charAt(0).toUpperCase() : "?");

    // Escapes text for safe insertion into innerHTML. Chat messages are untrusted
    // user input (from anyone in the room) -- without this, someone could type
    // HTML/script tags and run arbitrary JS in every other member's browser.
    const escapeHtml = (str) => {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    };

    // Create message function. `msg` is escaped by default; pass isHtml=true only
    // for content we generated ourselves (e.g. the PDF download link), never for
    // anything that came from another user.
    const createMessage = (name, msg, isOwnMessage, isHtml = false) => {
        const messageId = `message-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
        const alignmentClass = isOwnMessage ? "text-right" : "text-left";
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const safeName = escapeHtml(name);
        const safeMsg = isHtml ? msg : escapeHtml(msg);
        const content = `
        <div class="message ${alignmentClass}" id="${messageId}">
            <div class="avatar" style="background:${nameToColor(name)}">${initialOf(name)}</div>
            <div class="bubble-group">
                <div class="name">${safeName}<span class="time">${time}</span></div>
                <div class="text">${safeMsg}</div>
            </div>
        </div>`;
        messages.innerHTML += content;
        document.getElementById(messageId).scrollIntoView();
    };

    // Copies the room code to the clipboard with brief visual feedback.
    const copyRoomCode = () => {
        const el = document.getElementById('room-code');
        navigator.clipboard.writeText(el.textContent.trim()).then(() => {
            const original = el.textContent;
            el.textContent = 'Copied!';
            setTimeout(() => { el.textContent = original; }, 1200);
        });
    };

    // ---- Emoji picker ----
    const EMOJI_LIST = [
        '😀', '😂', '🤣', '😊', '😍', '😘', '😎', '🤔', '😢', '😭',
        '😡', '😱', '🥳', '😴', '🤗', '😇', '🙄', '😬', '🤯', '😜',
        '🤤', '🤢', '👀', '😏', '🙃', '😅', '🥰', '😳', '🤩', '😞',
        '👍', '👎', '👏', '🙏', '💪', '👋', '🤝', '✌️', '🤞', '👌',
        '❤️', '💔', '🔥', '🎉', '✨', '⭐', '💯', '💕', '💤', '💡',
        '🍕', '☕', '🎂', '🌍', '🚀', '⚽', '🎵', '📸', '✅', '❌',
        '⏰', '📌', '🙌', '😆', '😉', '🤦', '🤷', '👀', '🥲', '😌'
    ];

    const emojiBtn = document.getElementById('emoji-btn');
    const emojiPicker = document.getElementById('emoji-picker');
    const emojiGrid = document.getElementById('emoji-grid');
    const messageInput = document.getElementById('message');

    EMOJI_LIST.forEach((emoji) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'emoji-option';
        btn.textContent = emoji;
        btn.addEventListener('click', () => insertEmoji(emoji));
        emojiGrid.appendChild(btn);
    });

    const insertEmoji = (emoji) => {
        const start = messageInput.selectionStart ?? messageInput.value.length;
        const end = messageInput.selectionEnd ?? messageInput.value.length;
        const text = messageInput.value;
        messageInput.value = text.slice(0, start) + emoji + text.slice(end);
        const newPos = start + emoji.length;
        messageInput.focus();
        messageInput.setSelectionRange(newPos, newPos);
        emojiPicker.style.display = 'none';
    };

    emojiBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        emojiPicker.style.display = emojiPicker.style.display === 'none' ? 'block' : 'none';
    });

    document.addEventListener('click', (event) => {
        if (emojiPicker.style.display !== 'none' && !emojiPicker.contains(event.target) && event.target !== emojiBtn) {
            emojiPicker.style.display = 'none';
        }
    });

    // Handle incoming messages
    socketio.on("message", (data) => {
        createMessage(data.name, data.message, data.name === username);
    });

    // Send message
    const sendMessage = () => {
        const message = document.getElementById("message");
        if (message.value == "") return;
        socketio.emit("message", { data: message.value });
        message.value = "";
    };

    document.getElementById('message').addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            sendMessage();
        }
    });

    // Leave room
    const leaveRoom = () => {
        if (callState !== 'idle') socketio.emit('call_leave');
        stopMicCapture();
        socketio.emit("leave");
        window.location.href = "/home";
    };

    socketio.on("disconnect", () => {
        alert("Server has encountered an issue. Please leave the room.");
        leaveRoom();
    });

    // Handle .pdf file input
    document.getElementById('file-input').addEventListener('change', function() {
        const file = this.files[0];
        if (file && file.name.endsWith('.pdf')) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                socketio.emit('pdf_file', { filename: file.name, content: arrayBuffer });
                document.getElementById('file-input').value = ''; // Reset the file input
            };
            reader.readAsArrayBuffer(file);
        } else {
            alert("Please select a .pdf file");
        }
    });

    // Handle incoming translated .txt messages
    socketio.on('pdf_message', (data) => {
        const link = document.createElement('a');
        link.href = data.file_url;
        link.textContent = `Download ${data.filename}`;
        link.download = data.filename;
        createMessage(data.name, link.outerHTML, data.name === username, true);
    });

    // Toggle user list
    const activeUsersSpan = document.getElementById('active-users');
    const userListDiv = document.getElementById('user-list');

    const toggleUserList = () => {
        userListDiv.style.display = userListDiv.style.display === "none" ? "block" : "none";
    };

    const updateUserList = (users) => {
        activeUsersSpan.textContent = users.length; // Update user count
        userListDiv.innerHTML = ''; // Clear current list

        users.forEach(user => {
            const userItem = document.createElement('div');
            userItem.textContent = user.name;
            userListDiv.appendChild(userItem);
        });
    };

    socketio.on('update_users', (data) => {
        updateUserList(data.users);
    });

    // ---- Live audio-to-audio call ----
    // Real speech in, real (translated) speech out -- no text is shown or sent for call audio.
    // The mic is captured directly, segmented into utterances with simple voice-activity
    // detection, and each utterance is sent to the server as audio; the server transcribes,
    // translates, and synthesizes natural speech per recipient, sent back as audio.

    const callBtn = document.getElementById('call-btn');
    const muteBtn = document.getElementById('mute-btn');
    const callStatus = document.getElementById('call-status');
    const callTimerEl = document.getElementById('call-timer');
    const callActivity = document.getElementById('live-transcript'); // repurposed: shows an activity icon only, never words
    const incomingOverlay = document.getElementById('incoming-call-overlay');
    const incomingBanner = document.getElementById('incoming-call-banner');
    const incomingCallerNameEl = document.getElementById('incoming-caller-name');

    const micSupported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);

    // idle -> ringing-out (I'm calling) / ringing-in (someone's calling me) -> in-call
    let callState = 'idle';
    let inCall = false; // true only in 'in-call'
    let isMuted = false;
    let callSeconds = 0;
    let callTimerInterval = null;
    let incomingCallerName = null;

    let micStream = null;
    let audioCaptureCtx = null;
    let analyser = null;
    let vadDataArray = null;
    let vadCheckInterval = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isSpeechActive = false;
    let speechStartedAt = null;
    let silenceStartedAt = null;
    let isPlayingIncoming = false; // true while translated audio is playing, so we don't capture our own speakers

    const VAD_THRESHOLD = 10;          // RMS-ish level (0-255 scale) above which we consider it speech
    const SILENCE_HANGOVER_MS = 700;   // how long silence must persist before an utterance is considered finished
    const MIN_UTTERANCE_MS = 350;      // ignore blips shorter than this (clicks, breaths)
    const MIN_BLOB_BYTES = 800;        // ignore recordings too small to contain real speech

    const formatCallTime = (totalSeconds) => {
        const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const s = String(totalSeconds % 60).padStart(2, '0');
        return `${m}:${s}`;
    };

    // A ring tone synthesized with the Web Audio API so no audio asset is needed.
    let ringAudioCtx = null;
    let ringInterval = null;

    const playRingBeep = () => {
        if (!ringAudioCtx) ringAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ringAudioCtx.createOscillator();
        const gain = ringAudioCtx.createGain();
        osc.frequency.value = 480;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.15, ringAudioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ringAudioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ringAudioCtx.destination);
        osc.start();
        osc.stop(ringAudioCtx.currentTime + 0.35);
    };

    const startRinging = () => {
        stopRinging();
        playRingBeep();
        ringInterval = setInterval(playRingBeep, 1500);
    };

    const stopRinging = () => {
        clearInterval(ringInterval);
        ringInterval = null;
    };

    const showIncomingBanner = (callerName) => {
        incomingCallerName = callerName;
        incomingCallerNameEl.textContent = callerName;
        incomingOverlay.style.display = 'block';
        incomingBanner.style.display = 'flex';
        startRinging();
    };

    const hideIncomingBanner = () => {
        incomingOverlay.style.display = 'none';
        incomingBanner.style.display = 'none';
        incomingCallerName = null;
    };

    // Moves the UI into the fully-connected call state: starts the mic + timer, stops any ringing.
    const enterCallUI = () => {
        callState = 'in-call';
        inCall = true;
        stopRinging();
        hideIncomingBanner();
        startMicCapture();
        callBtn.textContent = '📞 End Call';
        callBtn.classList.add('in-call');
        callStatus.textContent = '🔴 In call';
        muteBtn.style.display = 'inline-block';
        callSeconds = 0;
        callTimerEl.textContent = '00:00';
        callTimerEl.style.display = 'inline';
        clearInterval(callTimerInterval);
        callTimerInterval = setInterval(() => {
            callSeconds++;
            callTimerEl.textContent = formatCallTime(callSeconds);
        }, 1000);
    };

    // Puts the UI into "ringing the room" while we wait for someone to accept.
    const enterOutgoingRingUI = () => {
        callState = 'ringing-out';
        callBtn.textContent = '📵 Cancel';
        callBtn.classList.add('in-call');
        callStatus.textContent = '📞 Calling…';
        startRinging();
    };

    // Resets all call UI/state back to "not in a call", and silences anything mid-playback.
    const resetCallUI = () => {
        callState = 'idle';
        inCall = false;
        isMuted = false;
        stopRinging();
        hideIncomingBanner();
        stopMicCapture();
        clearInterval(callTimerInterval);
        callTimerEl.style.display = 'none';
        callBtn.textContent = '📞 Start Call';
        callBtn.classList.remove('in-call');
        callStatus.textContent = '📞 Not in a call';
        muteBtn.style.display = 'none';
        muteBtn.textContent = 'Mute';
        callActivity.textContent = '';
    };

    if (!micSupported) {
        callBtn.disabled = true;
        callBtn.title = 'Live call requires microphone support (try Chrome, Edge, or Firefox)';
    }

    const pickRecorderMimeType = () => {
        const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
        for (const type of candidates) {
            if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) return type;
        }
        return '';
    };
    const recorderMimeType = pickRecorderMimeType();

    const blobToBase64 = (blob) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
    });

    const startNewRecorder = () => {
        if (!micStream) return;
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(micStream, recorderMimeType ? { mimeType: recorderMimeType } : undefined);
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.start();
    };

    // Flushes the current recording as one utterance and sends it to the server for
    // transcription + translation + speech synthesis -- no text ever appears client-side.
    const stopAndSendUtterance = () => {
        if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
        const finishedRecorder = mediaRecorder;
        finishedRecorder.onstop = async () => {
            if (recordedChunks.length === 0) return;
            const blob = new Blob(recordedChunks, { type: recorderMimeType || 'audio/webm' });
            if (blob.size < MIN_BLOB_BYTES) return;
            const base64 = await blobToBase64(blob);
            socketio.emit('voice_audio', { content: base64, mime: blob.type });
        };
        finishedRecorder.stop();
    };

    // Voice-activity loop: watches mic volume, segments continuous speech into utterances,
    // and never runs while incoming audio is playing (so we don't capture our own speaker output).
    const runVadLoop = () => {
        if (!analyser) return;

        if (isPlayingIncoming || isMuted || callState !== 'in-call') {
            if (isSpeechActive) {
                isSpeechActive = false;
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.onstop = null; // discard, don't send a truncated utterance
                    mediaRecorder.stop();
                }
            }
            return;
        }

        analyser.getByteTimeDomainData(vadDataArray);
        let sumSquares = 0;
        for (let i = 0; i < vadDataArray.length; i++) {
            const v = (vadDataArray[i] - 128) / 128;
            sumSquares += v * v;
        }
        const rms = Math.sqrt(sumSquares / vadDataArray.length) * 255;
        const now = Date.now();
        const speaking = rms > VAD_THRESHOLD;

        if (speaking) {
            silenceStartedAt = null;
            if (!isSpeechActive) {
                isSpeechActive = true;
                speechStartedAt = now;
                startNewRecorder();
                callActivity.textContent = '🎙️';
            }
        } else if (isSpeechActive) {
            if (silenceStartedAt === null) silenceStartedAt = now;
            if (now - silenceStartedAt > SILENCE_HANGOVER_MS && now - speechStartedAt > MIN_UTTERANCE_MS) {
                isSpeechActive = false;
                callActivity.textContent = '';
                stopAndSendUtterance();
            }
        }
    };

    const startMicCapture = async () => {
        if (!micSupported) return;
        try {
            micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) {
            alert('Microphone access was blocked. Please allow microphone access to make a call.');
            resetCallUI();
            return;
        }
        audioCaptureCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCaptureCtx.createMediaStreamSource(micStream);
        analyser = audioCaptureCtx.createAnalyser();
        analyser.fftSize = 512;
        vadDataArray = new Uint8Array(analyser.fftSize);
        source.connect(analyser);
        vadCheckInterval = setInterval(runVadLoop, 100);
    };

    const stopMicCapture = () => {
        clearInterval(vadCheckInterval);
        vadCheckInterval = null;
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.onstop = null;
            mediaRecorder.stop();
        }
        if (micStream) {
            micStream.getTracks().forEach((t) => t.stop());
            micStream = null;
        }
        if (audioCaptureCtx) {
            audioCaptureCtx.close();
            audioCaptureCtx = null;
        }
        analyser = null;
        isSpeechActive = false;
        callActivity.textContent = '';
    };

    // Plays translated speech audio received from another call participant.
    socketio.on('call_audio', (data) => {
        if (callState !== 'in-call') return;
        isPlayingIncoming = true;
        callActivity.textContent = '🔊';
        const audio = new Audio('data:audio/mpeg;base64,' + data.audio);
        const done = () => { isPlayingIncoming = false; callActivity.textContent = ''; };
        audio.onended = done;
        audio.onerror = done;
        audio.play().catch(done);
    });

    // Starts, cancels, or ends a call depending on where we are in the flow.
    const toggleCall = () => {
        if (!micSupported) return;
        if (callState === 'idle') {
            socketio.emit('call_invite');
            enterOutgoingRingUI();
        } else {
            // Cancelling an outgoing ring, or hanging up an active call -- both just leave.
            socketio.emit('call_leave');
            resetCallUI();
        }
    };

    const acceptCall = () => {
        socketio.emit('call_accept');
        enterCallUI();
    };

    const declineCall = () => {
        socketio.emit('call_decline');
        hideIncomingBanner();
        stopRinging();
        callState = 'idle';
    };

    // Someone in the room started a call; show the incoming-call banner unless I'm already in it.
    socketio.on('call_invite', (data) => {
        if (callState === 'in-call') return;
        callState = 'ringing-in';
        showIncomingBanner(data.name);
    });

    // Someone (possibly me, echoed back) joined the call.
    socketio.on('call_accepted', (data) => {
        if (data.name === username) return; // I already switched to in-call locally when I clicked Accept
        if (callState === 'ringing-out' || callState === 'ringing-in') {
            enterCallUI();
        }
        if (callState === 'in-call') {
            callStatus.textContent = `🔴 In call — ${data.name} joined`;
            setTimeout(() => { if (callState === 'in-call') callStatus.textContent = '🔴 In call'; }, 2000);
        }
    });

    // Someone declined my outgoing call.
    socketio.on('call_declined', (data) => {
        if (callState === 'ringing-out') {
            stopRinging();
            callStatus.textContent = `📵 ${data.name} declined`;
            setTimeout(() => { if (callState === 'ringing-out') { socketio.emit('call_leave'); resetCallUI(); } }, 2000);
        }
    });

    // Someone left the call -- if it was the caller and I hadn't answered yet, stop ringing.
    socketio.on('call_left', (data) => {
        if (incomingCallerName === data.name) {
            hideIncomingBanner();
            stopRinging();
            if (callState === 'ringing-in') callState = 'idle';
        }
        if (callState === 'in-call') {
            callStatus.textContent = `🔴 In call — ${data.name} left`;
            setTimeout(() => { if (callState === 'in-call') callStatus.textContent = '🔴 In call'; }, 2000);
        }
    });

    // Muting just stops the VAD loop from capturing/sending; the mic stream stays open
    // so unmuting is instant.
    const toggleMute = () => {
        isMuted = !isMuted;
        if (isMuted) {
            muteBtn.textContent = 'Unmute';
            callStatus.textContent = '🔇 Muted';
        } else {
            muteBtn.textContent = 'Mute';
            callStatus.textContent = '🔴 In call';
        }
    };
</script>
{% endblock %}
