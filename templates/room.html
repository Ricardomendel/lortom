{% extends 'base.html' %}
{% block content %}
<div class="message-box">
    <h3>Chat Room <span class="room-code" id="room-code" onclick="copyRoomCode()" title="Click to copy the room code">{{ code }}</span></h3>
    <button type="button" id="leave-btn" onclick="leaveRoom()">Leave Room</button>
    <div id="user-count" onclick="toggleUserList()">Users: <span id="active-users">0</span></div>
    <div id="user-list" style="display: none;"></div>
    
    <div class="call-bar">
        <span id="call-status" class="call-status">📞 Not in a call</span>
        <span id="call-timer" class="call-timer" style="display: none;">00:00</span>
        <button type="button" id="call-btn" onclick="toggleCall()">📞 Start Call</button>
        <button type="button" id="mute-btn" onclick="toggleMute()" style="display: none;">Mute</button>
    </div>
    <div id="live-transcript" class="muted"></div>

    <div id="incoming-call-overlay" class="incoming-call-overlay" style="display: none;"></div>
    <div id="incoming-call-banner" class="incoming-call-banner" style="display: none;">
        <div class="incoming-call-text">📞 <span id="incoming-caller-name"></span> is calling…</div>
        <div class="incoming-call-actions">
            <button type="button" class="accept-btn" onclick="acceptCall()">Accept</button>
            <button type="button" class="decline-btn" onclick="declineCall()">Decline</button>
        </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="inputs">
        <input type="file" id="file-input" accept=".pdf" style="display: none;">
        <button type="button" id="attach-btn" onclick="document.getElementById('file-input').click()" title="Attach a PDF">📎</button>
        <input type="text" placeholder="Message" name="message" id="message" required>
        <button type="button" name="send" id="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script type="text/javascript">
    var socketio = io();

    const messages = document.getElementById("messages");
    const username = "{{ session['name'] }}";

    // Derives a stable, pleasant color per name so avatars are consistent across the room.
    const nameToColor = (name) => {
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        const hue = Math.abs(hash) % 360;
        return `hsl(${hue}, 62%, 46%)`;
    };

    const initialOf = (name) => (name ? name.trim().charAt(0).toUpperCase() : "?");

    // Create message function
    const createMessage = (name, msg, isOwnMessage) => {
        const messageId = `message-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
        const alignmentClass = isOwnMessage ? "text-right" : "text-left";
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const content = `
        <div class="message ${alignmentClass}" id="${messageId}">
            <div class="avatar" style="background:${nameToColor(name)}">${initialOf(name)}</div>
            <div class="bubble-group">
                <div class="name">${name}<span class="time">${time}</span></div>
                <div class="text">${msg}</div>
            </div>
        </div>`;
        messages.innerHTML += content;
        document.getElementById(messageId).scrollIntoView();
    };

    // Copies the room code to the clipboard with brief visual feedback.
    const copyRoomCode = () => {
        const el = document.getElementById('room-code');
        navigator.clipboard.writeText(el.textContent.trim()).then(() => {
            const original = el.textContent;
            el.textContent = 'Copied!';
            setTimeout(() => { el.textContent = original; }, 1200);
        });
    };

    // Handle incoming messages
    socketio.on("message", (data) => {
        createMessage(data.name, data.message, data.name === username);
        // Only speak translated voice messages aloud if this user has joined the call themselves.
        if (data.is_voice && data.name !== username && inCall) {
            speak(data.message);
        }
    });

    // Send message
    const sendMessage = () => {
        const message = document.getElementById("message");
        if (message.value == "") return;
        socketio.emit("message", { data: message.value });
        message.value = "";
    };

    document.getElementById('message').addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            sendMessage();
        }
    });

    // Leave room
    const leaveRoom = () => {
        if (callState !== 'idle') socketio.emit('call_leave');
        if (recognition) recognition.stop();
        window.speechSynthesis.cancel();
        socketio.emit("leave");
        window.location.href = "/home";
    };

    socketio.on("disconnect", () => {
        alert("Server has encountered an issue. Please leave the room.");
        leaveRoom();
    });

    // Handle .pdf file input
    document.getElementById('file-input').addEventListener('change', function() {
        const file = this.files[0];
        if (file && file.name.endsWith('.pdf')) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                socketio.emit('pdf_file', { filename: file.name, content: arrayBuffer });
                document.getElementById('file-input').value = ''; // Reset the file input
            };
            reader.readAsArrayBuffer(file);
        } else {
            alert("Please select a .pdf file");
        }
    });

    // Handle incoming translated .txt messages
    socketio.on('pdf_message', (data) => {
        const link = document.createElement('a');
        link.href = data.file_url;
        link.textContent = `Download ${data.filename}`;
        link.download = data.filename;
        createMessage(data.name, link.outerHTML, data.name === username);
    });

    // Toggle user list
    const activeUsersSpan = document.getElementById('active-users');
    const userListDiv = document.getElementById('user-list');

    const toggleUserList = () => {
        userListDiv.style.display = userListDiv.style.display === "none" ? "block" : "none";
    };

    const updateUserList = (users) => {
        activeUsersSpan.textContent = users.length; // Update user count
        userListDiv.innerHTML = ''; // Clear current list

        users.forEach(user => {
            const userItem = document.createElement('div');
            userItem.textContent = user.name;
            userListDiv.appendChild(userItem);
        });
    };

    socketio.on('update_users', (data) => {
        updateUserList(data.users);
    });

    // ---- Live voice translation ----
    // The user's own configured language doubles as the language they speak
    // (for recognition) and the language they hear translations in (for playback).
    const myLanguage = "{{ session['language'] }}";

    // Maps Google Translate language codes to BCP-47 tags for the Web Speech API.
    const SPEECH_LANG_MAP = {
        en: 'en-US', es: 'es-ES', fr: 'fr-FR', de: 'de-DE', it: 'it-IT', pt: 'pt-PT', ak: 'ak-GH',
        ru: 'ru-RU', ja: 'ja-JP', ko: 'ko-KR', 'zh-CN': 'zh-CN', 'zh-TW': 'zh-TW',
        ar: 'ar-SA', hi: 'hi-IN', nl: 'nl-NL', pl: 'pl-PL', tr: 'tr-TR', vi: 'vi-VN',
        th: 'th-TH', id: 'id-ID', sv: 'sv-SE', da: 'da-DK', fi: 'fi-FI', no: 'nb-NO',
        el: 'el-GR', he: 'he-IL', cs: 'cs-CZ', ro: 'ro-RO', hu: 'hu-HU', uk: 'uk-UA',
        bg: 'bg-BG', hr: 'hr-HR', sk: 'sk-SK', ca: 'ca-ES', ms: 'ms-MY', tl: 'fil-PH',
        bn: 'bn-BD', ta: 'ta-IN', te: 'te-IN', ml: 'ml-IN', mr: 'mr-IN', gu: 'gu-IN',
        kn: 'kn-IN', pa: 'pa-IN', ur: 'ur-PK', fa: 'fa-IR', sr: 'sr-RS', sl: 'sl-SI',
        lt: 'lt-LT', lv: 'lv-LV', et: 'et-EE', is: 'is-IS', sw: 'sw-KE', af: 'af-ZA',
        am: 'am-ET', az: 'az-AZ', eu: 'eu-ES', be: 'be-BY', bs: 'bs-BA', gl: 'gl-ES',
        ka: 'ka-GE', km: 'km-KH', lo: 'lo-LA', mk: 'mk-MK', mn: 'mn-MN', ne: 'ne-NP',
        si: 'si-LK', so: 'so-SO', uz: 'uz-UZ', zu: 'zu-ZA', xh: 'xh-ZA', cy: 'cy-GB',
        ga: 'ga-IE', mt: 'mt-MT', my: 'my-MM'
    };
    const speechLangTag = (code) => SPEECH_LANG_MAP[code] || code;

    const callBtn = document.getElementById('call-btn');
    const muteBtn = document.getElementById('mute-btn');
    const callStatus = document.getElementById('call-status');
    const callTimerEl = document.getElementById('call-timer');
    const liveTranscript = document.getElementById('live-transcript');
    const incomingOverlay = document.getElementById('incoming-call-overlay');
    const incomingBanner = document.getElementById('incoming-call-banner');
    const incomingCallerNameEl = document.getElementById('incoming-caller-name');

    const RecognitionClass = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    // idle -> ringing-out (I'm calling) / ringing-in (someone's calling me) -> in-call
    let callState = 'idle';
    let inCall = false; // true only in 'in-call'; gates the mic + auto-speak-translations logic below
    let isMuted = false;
    let isSpeaking = false; // true while a translated reply is being spoken back, to avoid the mic picking it up
    let callSeconds = 0;
    let callTimerInterval = null;
    let incomingCallerName = null;

    const formatCallTime = (totalSeconds) => {
        const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const s = String(totalSeconds % 60).padStart(2, '0');
        return `${m}:${s}`;
    };

    // A ring tone synthesized with the Web Audio API so no audio asset is needed.
    let ringAudioCtx = null;
    let ringInterval = null;

    const playRingBeep = () => {
        if (!ringAudioCtx) ringAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ringAudioCtx.createOscillator();
        const gain = ringAudioCtx.createGain();
        osc.frequency.value = 480;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.15, ringAudioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ringAudioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ringAudioCtx.destination);
        osc.start();
        osc.stop(ringAudioCtx.currentTime + 0.35);
    };

    const startRinging = () => {
        stopRinging();
        playRingBeep();
        ringInterval = setInterval(playRingBeep, 1500);
    };

    const stopRinging = () => {
        clearInterval(ringInterval);
        ringInterval = null;
    };

    const showIncomingBanner = (callerName) => {
        incomingCallerName = callerName;
        incomingCallerNameEl.textContent = callerName;
        incomingOverlay.style.display = 'block';
        incomingBanner.style.display = 'flex';
        startRinging();
    };

    const hideIncomingBanner = () => {
        incomingOverlay.style.display = 'none';
        incomingBanner.style.display = 'none';
        incomingCallerName = null;
    };

    // Moves the UI into the fully-connected call state: starts the mic + timer, stops any ringing.
    const enterCallUI = () => {
        callState = 'in-call';
        inCall = true;
        stopRinging();
        hideIncomingBanner();
        try { recognition && recognition.start(); } catch (e) { /* already running */ }
        callBtn.textContent = '📞 End Call';
        callBtn.classList.add('in-call');
        callStatus.textContent = '🔴 In call';
        muteBtn.style.display = 'inline-block';
        callSeconds = 0;
        callTimerEl.textContent = '00:00';
        callTimerEl.style.display = 'inline';
        clearInterval(callTimerInterval);
        callTimerInterval = setInterval(() => {
            callSeconds++;
            callTimerEl.textContent = formatCallTime(callSeconds);
        }, 1000);
    };

    // Puts the UI into "ringing the room" while we wait for someone to accept.
    const enterOutgoingRingUI = () => {
        callState = 'ringing-out';
        callBtn.textContent = '📵 Cancel';
        callBtn.classList.add('in-call');
        callStatus.textContent = '📞 Calling…';
        startRinging();
    };

    // Resets all call UI/state back to "not in a call", and silences anything mid-playback.
    const resetCallUI = () => {
        callState = 'idle';
        inCall = false;
        isMuted = false;
        stopRinging();
        hideIncomingBanner();
        clearInterval(callTimerInterval);
        callTimerEl.style.display = 'none';
        callBtn.textContent = '📞 Start Call';
        callBtn.classList.remove('in-call');
        callStatus.textContent = '📞 Not in a call';
        muteBtn.style.display = 'none';
        muteBtn.textContent = 'Mute';
        liveTranscript.textContent = '';
        window.speechSynthesis.cancel();
    };

    if (RecognitionClass) {
        recognition = new RecognitionClass();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = speechLangTag(myLanguage);

        recognition.onresult = (event) => {
            let interim = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                const transcript = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    if (transcript.trim()) {
                        socketio.emit('message', { data: transcript.trim(), is_voice: true });
                    }
                } else {
                    interim += transcript;
                }
            }
            liveTranscript.textContent = interim;
        };

        recognition.onerror = (event) => {
            console.error('Speech recognition error:', event.error);
            if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                alert('Microphone access was blocked. Please allow microphone access to make a call.');
                resetCallUI();
            }
        };

        // The API auto-stops after a pause in speech; restart it as long as the call is still active.
        recognition.onend = () => {
            liveTranscript.textContent = '';
            if (inCall && !isMuted && !isSpeaking) {
                try { recognition.start(); } catch (e) { /* already running */ }
            }
        };
    } else {
        callBtn.disabled = true;
        callBtn.title = 'Live call is not supported in this browser (try Chrome or Edge)';
    }

    // Starts, cancels, or ends a call depending on where we are in the flow.
    const toggleCall = () => {
        if (!recognition) return;
        if (callState === 'idle') {
            socketio.emit('call_invite');
            enterOutgoingRingUI();
        } else {
            // Cancelling an outgoing ring, or hanging up an active call -- both just leave.
            if (recognition) recognition.stop();
            socketio.emit('call_leave');
            resetCallUI();
        }
    };

    const acceptCall = () => {
        socketio.emit('call_accept');
        enterCallUI();
    };

    const declineCall = () => {
        socketio.emit('call_decline');
        hideIncomingBanner();
        stopRinging();
        callState = 'idle';
    };

    // Someone in the room started a call; show the incoming-call banner unless I'm already in it.
    socketio.on('call_invite', (data) => {
        if (callState === 'in-call') return;
        callState = 'ringing-in';
        showIncomingBanner(data.name);
    });

    // Someone (possibly me, echoed back) joined the call.
    socketio.on('call_accepted', (data) => {
        if (data.name === username) return; // I already switched to in-call locally when I clicked Accept
        if (callState === 'ringing-out' || callState === 'ringing-in') {
            enterCallUI();
        }
        if (callState === 'in-call') {
            callStatus.textContent = `🔴 In call — ${data.name} joined`;
            setTimeout(() => { if (callState === 'in-call') callStatus.textContent = '🔴 In call'; }, 2000);
        }
    });

    // Someone declined my outgoing call.
    socketio.on('call_declined', (data) => {
        if (callState === 'ringing-out') {
            stopRinging();
            callStatus.textContent = `📵 ${data.name} declined`;
            setTimeout(() => { if (callState === 'ringing-out') { socketio.emit('call_leave'); resetCallUI(); } }, 2000);
        }
    });

    // Someone left the call -- if it was the caller and I hadn't answered yet, stop ringing.
    socketio.on('call_left', (data) => {
        if (incomingCallerName === data.name) {
            hideIncomingBanner();
            stopRinging();
            if (callState === 'ringing-in') callState = 'idle';
        }
        if (callState === 'in-call') {
            callStatus.textContent = `🔴 In call — ${data.name} left`;
            setTimeout(() => { if (callState === 'in-call') callStatus.textContent = '🔴 In call'; }, 2000);
        }
    });

    const toggleMute = () => {
        isMuted = !isMuted;
        if (isMuted) {
            recognition.stop();
            muteBtn.textContent = 'Unmute';
            callStatus.textContent = '🔇 Muted';
        } else {
            try { recognition.start(); } catch (e) { /* already running */ }
            muteBtn.textContent = 'Mute';
            callStatus.textContent = '🔴 In call';
        }
    };

    // Speaks a translated message aloud, pausing the mic first so it doesn't hear itself.
    const speak = (text) => {
        if (!('speechSynthesis' in window)) return;
        if (inCall && !isMuted && recognition) {
            isSpeaking = true;
            recognition.stop();
        }
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = speechLangTag(myLanguage);
        utterance.onend = () => {
            isSpeaking = false;
            if (inCall && !isMuted && recognition) {
                try { recognition.start(); } catch (e) { /* already running */ }
            }
        };
        window.speechSynthesis.speak(utterance);
    };
</script>
{% endblock %}
