{% set emoji3d = "https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@1ffb34c752ecf5d402f04cfb4b392c77f57c54bc/assets" %}
<svg class="hero-illustration" viewBox="0 0 640 260" role="img" aria-label="Two people having a conversation, each seeing it translated into their own language">
    <ellipse cx="150" cy="238" rx="62" ry="10" fill="rgba(20,20,50,0.10)"/>
    <ellipse cx="490" cy="238" rx="62" ry="10" fill="rgba(20,20,50,0.10)"/>

    <!-- Person A: 3D-rendered figure instead of a flat drawn shape -->
    <image href="{{ emoji3d }}/Woman%20raising%20hand/Default/3D/woman_raising_hand_3d_default.png" x="66" y="72" width="168" height="168"/>

    <!-- Person B: 3D-rendered figure instead of a flat drawn shape -->
    <image href="{{ emoji3d }}/Man%20raising%20hand/Default/3D/man_raising_hand_3d_default.png" x="406" y="72" width="168" height="168"/>

    <!-- Speech bubble A: English -->
    <g transform="translate(115,40)">
        <rect x="-72" y="-32" width="144" height="56" rx="18" fill="var(--surface)" stroke="var(--border)"/>
        <path d="M -6 24 L 6 24 L -2 42 Z" fill="var(--surface)" stroke="var(--border)"/>
        <text x="0" y="4" text-anchor="middle" font-family="Inter, sans-serif" font-size="19" font-weight="700" fill="var(--text)">Hello!</text>
    </g>

    <!-- Speech bubble B: Spanish -->
    <g transform="translate(525,40)">
        <rect x="-72" y="-32" width="144" height="56" rx="18" fill="var(--surface)" stroke="var(--border)"/>
        <path d="M -6 24 L 6 24 L -2 42 Z" fill="var(--surface)" stroke="var(--border)"/>
        <text x="0" y="4" text-anchor="middle" font-family="Inter, sans-serif" font-size="19" font-weight="700" fill="var(--text)">¡Hola!</text>
    </g>

    <!-- Translate badge between them: a real 3D icon instead of a hand-drawn one -->
    <image href="{{ emoji3d }}/Counterclockwise%20arrows%20button/3D/counterclockwise_arrows_button_3d.png" x="290" y="15" width="60" height="60"/>
</svg>
