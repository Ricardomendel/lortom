{% extends "base.html" %}

{% block content %}
    <div class="welcome-container">
        <div class="floating-decor" aria-hidden="true">
            <span class="float-item" style="--x:8%; --delay:0s; --duration:9s;">🌍</span>
            <span class="float-item" style="--x:85%; --delay:1.5s; --duration:11s;">💬</span>
            <span class="float-item" style="--x:20%; --delay:4s; --duration:10s;">🗣️</span>
            <span class="float-item" style="--x:75%; --delay:2.2s; --duration:8s;">👋</span>
            <span class="float-item" style="--x:50%; --delay:5.5s; --duration:12s;">🌐</span>
            <span class="float-item" style="--x:35%; --delay:3.2s; --duration:9.5s;">✨</span>
            <span class="float-item" style="--x:65%; --delay:6.5s; --duration:10.5s;">📞</span>
        </div>
        <div class="welcome-message" id="welcome-text">Welcome to LorTam</div>
        <div class="language-text" id="language-text"></div>

        <svg class="hero-illustration" viewBox="0 0 640 260" role="img" aria-label="Two people having a conversation, each seeing it translated into their own language">
            <defs>
                <linearGradient id="personA" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#8285f5"/>
                    <stop offset="100%" stop-color="#5b5fef"/>
                </linearGradient>
                <linearGradient id="personB" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#2bd1a6"/>
                    <stop offset="100%" stop-color="#17b890"/>
                </linearGradient>
                <linearGradient id="brandBadge" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#5b5fef"/>
                    <stop offset="100%" stop-color="#17b890"/>
                </linearGradient>
            </defs>

            <ellipse cx="150" cy="245" rx="70" ry="11" fill="rgba(20,20,50,0.08)"/>
            <ellipse cx="490" cy="245" rx="70" ry="11" fill="rgba(20,20,50,0.08)"/>

            <!-- Person A -->
            <g transform="translate(150,150)">
                <path d="M -55 95 Q -62 20 0 8 Q 62 20 55 95 Z" fill="url(#personA)"/>
                <path d="M 44 55 Q 82 42 88 6" stroke="url(#personA)" stroke-width="17" fill="none" stroke-linecap="round"/>
                <circle cx="0" cy="-25" r="38" fill="url(#personA)"/>
                <circle cx="-12" cy="-28" r="4" fill="#1c1e2b"/>
                <circle cx="12" cy="-28" r="4" fill="#1c1e2b"/>
                <path d="M -11 -12 Q 0 -3 11 -12" stroke="#1c1e2b" stroke-width="3.4" fill="none" stroke-linecap="round"/>
            </g>

            <!-- Person B -->
            <g transform="translate(490,150) scale(-1,1)">
                <path d="M -55 95 Q -62 20 0 8 Q 62 20 55 95 Z" fill="url(#personB)"/>
                <path d="M 44 55 Q 82 42 88 6" stroke="url(#personB)" stroke-width="17" fill="none" stroke-linecap="round"/>
                <circle cx="0" cy="-25" r="38" fill="url(#personB)"/>
                <circle cx="-12" cy="-28" r="4" fill="#1c1e2b"/>
                <circle cx="12" cy="-28" r="4" fill="#1c1e2b"/>
                <path d="M -11 -12 Q 0 -3 11 -12" stroke="#1c1e2b" stroke-width="3.4" fill="none" stroke-linecap="round"/>
            </g>

            <!-- Speech bubble A: English -->
            <g transform="translate(120,40)">
                <rect x="-72" y="-32" width="144" height="56" rx="18" fill="var(--surface)" stroke="var(--border)"/>
                <path d="M -6 24 L 6 24 L -2 42 Z" fill="var(--surface)" stroke="var(--border)"/>
                <text x="0" y="4" text-anchor="middle" font-family="Inter, sans-serif" font-size="19" font-weight="700" fill="var(--text)">Hello!</text>
            </g>

            <!-- Speech bubble B: Spanish -->
            <g transform="translate(520,40)">
                <rect x="-72" y="-32" width="144" height="56" rx="18" fill="var(--surface)" stroke="var(--border)"/>
                <path d="M -6 24 L 6 24 L -2 42 Z" fill="var(--surface)" stroke="var(--border)"/>
                <text x="0" y="4" text-anchor="middle" font-family="Inter, sans-serif" font-size="19" font-weight="700" fill="var(--text)">¡Hola!</text>
            </g>

            <!-- Translate badge between them -->
            <g transform="translate(320,45)">
                <circle r="27" fill="url(#brandBadge)"/>
                <path d="M -11 -5 Q 0 -15 11 -5" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>
                <path d="M 6 -11 L 11 -5 L 4 -2" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M 11 5 Q 0 15 -11 5" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>
                <path d="M -6 11 L -11 5 L -4 2" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
        </svg>

        <div class="feature-pills">
            <span class="pill">🌍 Real-time translation</span>
            <span class="pill">📞 Live translated calls</span>
            <span class="pill">📄 PDF translation</span>
        </div>
        <div class="enter-room">
            <a href="/room">Enter a Chat Room</a>
        </div>
    </div>

    <script>
        const welcomeText = document.getElementById('welcome-text');
        const languageText = document.getElementById('language-text');

        const translations = [
        { language: 'English', text: 'Welcome to LorTam'},
        { language: 'Spanish', text: 'Bienvenido a LorTam' },
        { language: 'French', text: 'Bienvenue à LorTam' },
        { language: 'German', text: 'Willkommen bei LorTam' },
        { language: 'Italian', text: 'Benvenuti a LorTam' },
        { language: 'Japanese', text: 'ロルタムへようこそ' },
        { language: 'Chinese', text: '欢迎来到 LorTam' },
        { language: 'Russian', text: 'Добро пожаловать в LorTam' },
        { language: 'Arabic', text: 'مرحبا بك في LorTam' },
        { language: 'Hindi', text: 'LorTam में आपका स्वागत है' },
        { language: 'Portuguese', text: 'Bem-vindo ao LorTam' },
        { language: 'Korean', text: '로르탐에 오신 것을 환영합니다' },
        { language: 'Turkish', text: 'LorTam\'a Hoşgeldiniz' },
        { language: 'Swedish', text: 'Välkommen till LorTam' },
        { language: 'Dutch', text: 'Welkom bij LorTam' },
        { language: 'Greek', text: 'Καλώς ήρθατε στο LorTam' },
        { language: 'Hebrew', text: 'ברוך הבא ל-LorTam' },
        { language: 'Polish', text: 'Witamy w LorTam' },
        { language: 'Danish', text: 'Velkommen til LorTam' },
        { language: 'Finnish', text: 'Tervetuloa LorTamiin' },
        { language: 'Norwegian', text: 'Velkommen til LorTam' },
        { language: 'Czech', text: 'Vítejte v LorTam' },
        { language: 'Hungarian', text: 'Üdvözöljük a LorTam-ban' },
        { language: 'Thai', text: 'ยินดีต้อนรับสู่ LorTam' },
        { language: 'Vietnamese', text: 'Chào mừng đến với LorTam' }
    ];

        let currentIndex = 0;

        // Restarts the CSS fade-in animation so each language swap animates in, not just the first.
        const replay = (el) => {
            el.style.animation = 'none';
            void el.offsetWidth;
            el.style.animation = '';
        };

        function changeLanguage() {
            currentIndex = (currentIndex + 1) % translations.length;
            const translation = translations[currentIndex];
            welcomeText.textContent = translation.text;
            languageText.textContent = `(${translation.language})`;
            replay(welcomeText);
            replay(languageText);
        }

        setInterval(changeLanguage, 1800);
    </script>
{% endblock %}
